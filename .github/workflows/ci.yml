name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: DSP core tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64 AVX2", os: ubuntu-latest }
          - { name: "macOS arm64 NEON", os: macos-latest }
          - { name: "Windows x86_64 AVX2", os: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Show machine
        shell: bash
        run: uname -a; cmake --version; python --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: NumPy reference vs PyTorch model (Linux only)
        if: runner.os == 'Linux'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          cd training && python check_reference_vs_torch.py
      - name: Check UI master SVG parses
        run: python -c "import xml.etree.ElementTree as ET; r = ET.parse('docs/ui_master.svg').getroot(); assert r.tag == '{http://www.w3.org/2000/svg}svg', r.tag; print('ui_master.svg ok')"

  plugin:
    name: Plug-in (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64 VST3", os: ubuntu-latest, pluginval: pluginval_Linux.zip, binary: ./pluginval }
          - { name: "macOS Universal VST3 + AU", os: macos-latest, pluginval: pluginval_macOS.zip, binary: ./pluginval.app/Contents/MacOS/pluginval }
          - { name: "Windows x86_64 VST3", os: windows-latest, pluginval: pluginval_Windows.zip, binary: ./pluginval.exe }
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxrender-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev xvfb
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZEROFB_BUILD_PLUGIN=ON $extra
      - name: Build plug-in and tools
        run: cmake --build build --config Release --parallel --target ZeroFb_All UiSnapshot PluginSoakTest
      - name: Wrapper checks and one hour endurance run
        shell: bash
        run: |
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          $run ctest --test-dir build -C Release -R PluginSoakTest --output-on-failure --verbose
      - name: Render the editor
        shell: bash
        run: |
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          tool=$(find build -type f \( -name UiSnapshot -o -name UiSnapshot.exe \) | head -1)
          $run "$tool" ui_render.png 2
      - name: Download pluginval
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval }}"
          unzip -q pluginval.zip
      - name: pluginval (strictness 8)
        shell: bash
        run: |
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          plugin=$(find build/ZeroFb_artefacts -name "ZERO-FB.vst3" -maxdepth 3 | head -1)
          $run "${{ matrix.binary }}" --strictness-level 8 --validate-in-process --timeout-ms 600000 "$plugin"
      - name: auval and pluginval for the AU (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/ZeroFb_artefacts/Release/AU/ZERO-FB.component "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Zfb1 Svwl
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --timeout-ms 600000 \
            "$HOME/Library/Audio/Plug-Ins/Components/ZERO-FB.component"
      - name: Check universal binary (macOS)
        if: runner.os == 'macOS'
        run: lipo -archs build/ZeroFb_artefacts/Release/VST3/ZERO-FB.vst3/Contents/MacOS/ZERO-FB | tee /dev/stderr | grep -q "x86_64" 
      - uses: actions/upload-artifact@v7
        with:
          name: zero-fb-${{ runner.os }}-unsigned-no-model
          path: |
            build/ZeroFb_artefacts/Release/VST3
            build/ZeroFb_artefacts/Release/AU
            ui_render.png
          if-no-files-found: error
