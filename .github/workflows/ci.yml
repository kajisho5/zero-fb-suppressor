name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: DSP core tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64 AVX2", os: ubuntu-latest }
          - { name: "macOS arm64 NEON", os: macos-latest }
          - { name: "Windows x86_64 AVX2", os: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Show machine
        shell: bash
        run: uname -a; cmake --version; python --version
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: NumPy reference vs PyTorch model (Linux only)
        if: runner.os == 'Linux'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          cd training && python check_reference_vs_torch.py
      - name: Check UI master SVG parses
        run: python -c "import xml.etree.ElementTree as ET; r = ET.parse('docs/ui_master.svg').getroot(); assert r.tag == '{http://www.w3.org/2000/svg}svg', r.tag; print('ui_master.svg ok')"
